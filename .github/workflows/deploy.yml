name: Deploy to Cloudflare Workers

# Every push to main goes live. There is no separate staging environment, so the
# `build` job is what stands between a bad commit and production.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race for the same Worker.
concurrency:
  group: deploy-cloudflare-workers
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `NEXT_PUBLIC_*` is inlined at build time, so the site URL and the
      # indexing flag have to be present here, not at runtime on the Worker.
      - name: Build (Next.js + OpenNext worker bundle)
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_ALLOW_INDEXING: ${{ vars.NEXT_PUBLIC_ALLOW_INDEXING }}

      - name: Deploy
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
